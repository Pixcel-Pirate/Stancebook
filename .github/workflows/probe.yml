name: probe
on:
  push:
    branches: [claude/project-thread-ypsboq]
    paths: [.github/workflows/probe.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            https://wow.zamimg.com/modelviewer/classic/viewer/viewer.min.js \
            https://wow.zamimg.com/modelviewer/classic/meta/character/humanmale.json \
            https://wow.zamimg.com/modelviewer/classic/meta/character/humanfemale.json \
            https://wow.zamimg.com/modelviewer/classic/meta/item/1.json \
            https://www.wowhead.com/classic/dressing-room \
            https://www.wowhead.com/classic/modelviewer ; do
            echo "=== $u"; curl -sS -o /tmp/b -D - -H 'Origin: https://pixcel-pirate.github.io' "$u" | grep -iE '^(HTTP|access-control|x-frame|content-security|content-type|content-length)'; head -c 300 /tmp/b; echo
          done
